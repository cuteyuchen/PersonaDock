<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>PersonaDock Control Plane</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/editor.css">
  <link rel="stylesheet" href="/assets/artifacts.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">PD</div>
        <div class="brand-copy">
          <div class="brand-name">PersonaDock</div>
          <div class="brand-version" id="brand-version">正在连接控制面</div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        本地优先控制平面<br>
        Persona、运行时和密钥不上传
      </div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <div class="breadcrumbs">
          <span>PersonaDock</span>
          <span aria-hidden="true">/</span>
          <strong id="route-title">概览</strong>
        </div>
        <div class="topbar-spacer"></div>
        <div class="connection-state" id="connection-state">
          <span class="connection-dot" aria-hidden="true"></span>
          <span id="connection-label">正在连接</span>
        </div>
        <button class="icon-button" id="refresh-button" type="button" title="刷新当前页面" aria-label="刷新当前页面">↻</button>
        <button class="button small" id="token-button" type="button">访问令牌</button>
      </header>
      <div class="loading-line" id="loading-line" hidden></div>
      <main class="workspace" id="workspace" tabindex="-1">
        <div class="empty-state"><strong>正在加载控制面</strong>正在读取本地 Registry 和 Web Capability。</div>
      </main>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
  <div id="dialog-root"></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui,sans-serif">PersonaDock Web 控制面需要启用 JavaScript。</div>
  </noscript>
  <script src="/assets/app.js" defer></script>
  <script src="/assets/lifecycle.js" defer></script>
  <script src="/assets/editor.js" defer></script>
  <script src="/assets/artifacts.js" defer></script>
</body>
</html>
